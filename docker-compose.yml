version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: evanesc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evanesc
      POSTGRES_PASSWORD: evanesc
      POSTGRES_DB: evanesc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evanesc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evanesc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
