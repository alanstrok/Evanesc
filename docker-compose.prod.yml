version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: evanesc-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evanesc:${POSTGRES_PASSWORD}@postgres:5432/evanesc
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - evanesc-network

  postgres:
    image: postgres:16-alpine
    container_name: evanesc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evanesc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evanesc}
      POSTGRES_DB: evanesc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evanesc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evanesc-network

  redis:
    image: redis:7-alpine
    container_name: evanesc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evanesc-network

  minio:
    image: minio/minio:latest
    container_name: evanesc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evanesc-network

networks:
  evanesc-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
