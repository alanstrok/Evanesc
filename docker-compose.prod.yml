version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: evanesc-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evanesc:${POSTGRES_PASSWORD}@postgres:5432/evanesc
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evanesc-network

  postgres:
    image: postgres:16-alpine
    container_name: evanesc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evanesc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evanesc}
      POSTGRES_DB: evanesc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evanesc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evanesc-network

  redis:
    image: redis:7-alpine
    container_name: evanesc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evanesc-network

networks:
  evanesc-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads-data:
